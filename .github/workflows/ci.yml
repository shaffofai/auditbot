# Audit bot — test, build, verify, publish.
#
# The automatic GITHUB_TOKEN is enough to publish to the organisation's
# registry. CI does not deploy — deploys are by hand (README.md, "Deploy").
# It publishes .../shaffofai-auditbot:sha-<commit>, a tag that never moves —
# which is what makes a rollback possible.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Every module compiles
        run: python -m compileall -q auditbot tests
      - name: Suites
        run: python -m pytest -q -p no:cacheprovider tests

  image:
    name: Build, verify, publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: img
        run: echo "name=$(echo 'ghcr.io/${{ github.repository_owner }}/shaffofai-auditbot' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: No credential reached the image
        run: |
          set -eu
          found=$(docker run --rm --entrypoint sh "${{ steps.img.outputs.name }}:sha-${{ github.sha }}" -c \
            'find /app -xdev \( -name ".env" -o -name "*.env" -o -name "*service-account*.json" \) 2>/dev/null' || true)
          [ -z "$found" ] || { echo "::error::credential-shaped file in the image"; echo "$found"; exit 1; }

      - name: The image boots and stays healthy
        run: |
          # Started the way compose starts it (read-only root, /tmp in memory),
          # with every outside address unreachable: the bot must keep running,
          # keep its heartbeat and say why it cannot reach anything.
          set -eu
          docker run -d --name bot --read-only --tmpfs /tmp:size=8m \
            --health-interval 5s --health-start-period 5s \
            -e TELEGRAM_BOT_TOKEN=000:ci -e TELEGRAM_API_URL=http://127.0.0.1:9 \
            -e PLATFORM_URL=http://127.0.0.1:9 \
            -e PLATFORM_USERNAME=ci -e PLATFORM_PASSWORD=ci \
            "${{ steps.img.outputs.name }}:sha-${{ github.sha }}"
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' bot)
            [ "$state" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' bot)" = true ] || break
            sleep 2
          done
          docker logs bot 2>&1 | tail -20
          [ "$(docker inspect -f '{{.State.Health.Status}}' bot)" = healthy ] \
            || { echo "::error::the bot is not healthy"; exit 1; }
          docker logs bot 2>&1 | grep -q "auditbot running" \
            || { echo "::error::the bot did not start its loops"; exit 1; }
          ! docker logs bot 2>&1 | grep -q "000:ci" \
            || { echo "::error::the token reached the log"; exit 1; }
          echo "boots, healthy, token not logged"

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha

      - name: What to run on the server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "### Published \`sha-${{ github.sha }}\`"
            echo "Deploys are by hand (README.md, \"Deploy\"). On the server:"
            echo '```bash'
            echo "cd ~/shaffofai-auditbot && git pull --ff-only"
            echo "sudo sed -i 's/^TAG=.*/TAG=sha-${{ github.sha }}/' .env"
            echo "sudo docker compose pull && sudo docker compose up -d --no-build"
            echo '```'
            echo "Roll back: the same \`sed\`, \`pull\` and \`up\` with an earlier green \`sha-<commit>\`."
          } >> "$GITHUB_STEP_SUMMARY"
